name: 'Scan Image'
description: 'Generate SBOM, scan container image for vulnerabilities, and upload SARIF to GitHub Security tab'

inputs:
  image:
    description: 'Container image to scan (e.g., ghcr.io/org/repo:tag)'
    required: true
  fail_build:
    description: 'Fail the build if vulnerabilities are found'
    required: false
    default: 'false'
  severity_cutoff:
    description: 'Cutoff severity to fail build on (critical, high, medium, low)'
    required: false
    default: 'critical'
  output_file:
    description: 'Output file name for the generated SBOM'
    required: false
    default: 'sbom.spdx.json'

runs:
  using: 'composite'
  steps:
    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      with:
        image: ${{ inputs.image }}
        format: spdx-json
        output-file: ${{ inputs.output_file }}
        upload-artifact: true
        upload-release-assets: false

    - name: Scan image for vulnerabilities
      id: scan
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
      with:
        image: ${{ inputs.image }}
        fail-build: ${{ inputs.fail_build }}
        severity-cutoff: ${{ inputs.severity_cutoff }}
        output-format: sarif

    - name: Upload scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
      if: always()
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
