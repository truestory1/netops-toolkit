name: 'Set up Docker'
description: 'Set up QEMU, Buildx, repository name environment variable, and log into registry'

inputs:
  registry:
    description: 'Image registry'
    required: false
    default: 'ghcr.io'
  username:
    description: 'Registry username'
    required: false
    default: ${{ github.actor }}
  github_token:
    description: 'Registry password or GitHub token'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Set up variable repository name
      shell: bash
      run: echo "IMAGE_NAME=${{ github.repository }}" >> $GITHUB_ENV

    - name: Image registry login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.github_token }}
