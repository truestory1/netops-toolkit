name: buildx-on-pr

on:
  pull_request:
  workflow_dispatch:

env:
  PLATFORMS: linux/amd64,linux/arm64
  REGISTRY: ghcr.io

jobs:
  buildx-on-pr:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for changes in workflows or Containerfile
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- .github/workflows Containerfile)
            if [ -z "$CHANGES" ]; then
              echo "No changes in .github/workflows or Containerfile. Skipping build."
              echo "match=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "match=true" >> $GITHUB_OUTPUT

      - name: Build, test, and scan image
        if: steps.filter.outputs.match == 'true'
        uses: ./.github/actions/build-pr-image
        with:
          registry: ${{ env.REGISTRY }}
          platforms: ${{ env.PLATFORMS }}
          pr_number: ${{ github.event.pull_request.number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
